name: Dispatch scheduled Instagram publish

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-instagram-publish-dispatch
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: windows-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Dispatch first due job
        id: dispatch
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\daily-realestate\dispatch-scheduled-publish.ps1

      - name: Commit dispatched job
        if: ${{ steps.dispatch.outputs.dispatched == 'true' }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- daily-realestate/scheduled-publish-queue.json
          git commit -m "Dispatch scheduled Instagram job ${{ steps.dispatch.outputs.job_id }}"
          git push origin HEAD:main

      - name: Start verified Instagram publish workflow
        if: ${{ steps.dispatch.outputs.dispatched == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE_DATE: ${{ steps.dispatch.outputs.date }}
          SCHEDULE_NUMBER: ${{ steps.dispatch.outputs.number }}
          EXPECTED_TITLE: ${{ steps.dispatch.outputs.title }}
          EXPECTED_SOURCE: ${{ steps.dispatch.outputs.source }}
        run: |
          $payload = @{
            ref = 'main'
            inputs = @{
              date = $env:SCHEDULE_DATE
              numbers = $env:SCHEDULE_NUMBER
              publish_to_instagram = 'true'
              review_confirmed = 'true'
              image_usage_confirmed = 'true'
              expected_title = $env:EXPECTED_TITLE
              expected_source = $env:EXPECTED_SOURCE
            }
          } | ConvertTo-Json -Depth 5
          $payload | gh api --method POST "repos/${{ github.repository }}/actions/workflows/publish-selected-instagram.yml/dispatches" --input -
