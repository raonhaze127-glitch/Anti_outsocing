name: Publish requested Instagram carousel

on:
  push:
    paths:
      - "daily-realestate/publish-request.json"

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read publish request
        id: request
        shell: pwsh
        run: |
          $request = Get-Content -LiteralPath .\daily-realestate\publish-request.json -Raw -Encoding UTF8 | ConvertFrom-Json
          "enabled=$($request.enabled.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (-not $request.date) { throw "publish-request.json missing date" }
          if (-not $request.numbers) { throw "publish-request.json missing numbers" }
          "date=$($request.date)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "numbers=$($request.numbers)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "publish_to_instagram=$($request.publish_to_instagram)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "review_confirmed=$($request.review_confirmed)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "image_usage_confirmed=$($request.image_usage_confirmed)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Skip disabled request
        if: ${{ steps.request.outputs.enabled != 'true' }}
        shell: pwsh
        run: |
          Write-Host "publish-request.json is disabled. No carousel will be built or published."

      - name: Verify reviewed article mapping
        if: ${{ steps.request.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          $request = Get-Content -LiteralPath .\daily-realestate\publish-request.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $candidatePath = ".\daily-realestate\output\$($request.date)\candidates.json"
          if (-not (Test-Path -LiteralPath $candidatePath)) { throw "Candidates not found: $candidatePath" }
          $candidates = @(Get-Content -LiteralPath $candidatePath -Raw -Encoding UTF8 | ConvertFrom-Json)
          $selectedNumbers = @($request.numbers -split '[,\s]+' | Where-Object { $_ -match '^\d+$' } | ForEach-Object { [int]$_ } | Select-Object -Unique)
          $expected = @($request.expected_articles)
          if ($expected.Count -ne $selectedNumbers.Count) {
            throw "expected_articles must contain one reviewed mapping for every selected number."
          }
          $normalize = { param([string]$value) (($value -replace '\s+', ' ').Trim()) }
          foreach ($number in $selectedNumbers) {
            if ($number -lt 1 -or $number -gt $candidates.Count) { throw "Invalid article number: $number" }
            $reviewed = @($expected | Where-Object { [int]$_.number -eq $number })
            if ($reviewed.Count -ne 1) { throw "Missing or duplicate expected_articles mapping for number $number." }
            $actual = $candidates[$number - 1]
            $actualTitle = & $normalize ([string]$actual.title)
            $actualSource = & $normalize ([string]$actual.source)
            $expectedTitle = & $normalize ([string]$reviewed[0].title)
            $expectedSource = & $normalize ([string]$reviewed[0].source)
            if ($actualTitle -ne $expectedTitle -or $actualSource -ne $expectedSource) {
              throw "Reviewed mapping mismatch for number $number. Expected: '$expectedTitle' / '$expectedSource'. Actual: '$actualTitle' / '$actualSource'. Aborting before build and Meta publishing."
            }
            Write-Host "Verified $number. $actualTitle | $actualSource"
          }

      - name: Build selected carousels
        if: ${{ steps.request.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          $request = Get-Content -LiteralPath .\daily-realestate\publish-request.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $date = "${{ steps.request.outputs.date }}"
          $numbers = "${{ steps.request.outputs.numbers }}" -split '[,\s]+' | Where-Object { $_ -match '^\d+$' } | ForEach-Object { [int]$_ } | Select-Object -Unique

          if (-not $request.expected_articles -or @($request.expected_articles).Count -ne $numbers.Count) {
            throw "expected_articles must contain exactly one title/source record for every requested number"
          }

          $candidatesPath = ".\daily-realestate\output\$date\candidates.json"
          if (-not (Test-Path -LiteralPath $candidatesPath)) { throw "Candidate snapshot not found: $candidatesPath" }
          $candidates = Get-Content -LiteralPath $candidatesPath -Raw -Encoding UTF8 | ConvertFrom-Json
          foreach ($expected in @($request.expected_articles)) {
            $number = [int]$expected.number
            if ($numbers -notcontains $number) { throw "expected_articles includes unrequested number $number" }
            $candidate = @($candidates) | Select-Object -Index ($number - 1)
            if (-not $candidate -or $candidate.title -ne $expected.title -or $candidate.source -ne $expected.source) {
              throw "Candidate mismatch for number $number. Expected '$($expected.title)' / '$($expected.source)'"
            }
          }

          foreach ($number in $numbers) {
            $setName = "article-$('{0:D2}' -f $number)-carousel"
            $carouselDir = ".\daily-realestate\output\$date\$setName"
            $cards = if (Test-Path -LiteralPath $carouselDir) { @(Get-ChildItem -LiteralPath $carouselDir -Filter '*.png') } else { @() }
            $isPrepared = (Test-Path -LiteralPath (Join-Path $carouselDir 'REVIEW.md')) -and (Test-Path -LiteralPath (Join-Path $carouselDir 'article-detail.json')) -and (Test-Path -LiteralPath (Join-Path $carouselDir 'caption.txt')) -and $cards.Count -eq 6
            if ($isPrepared) {
              Write-Host "Using prebuilt reviewed carousel: $setName"
            } else {
              powershell -NoProfile -ExecutionPolicy Bypass -File .\daily-realestate\build-selected.ps1 -Date $date -Numbers "$number"
            }
          }

      - name: Prepare public JPEG site
        if: ${{ steps.request.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          $date = "${{ steps.request.outputs.date }}"
          $numbers = "${{ steps.request.outputs.numbers }}" -split '[,\s]+' | Where-Object { $_ -match '^\d+$' } | ForEach-Object { [int]$_ } | Select-Object -Unique
          $siteRoot = Join-Path $PWD "_site"
          New-Item -ItemType Directory -Path $siteRoot -Force | Out-Null
          $publicRoot = Join-Path $siteRoot "realestate\$date"
          New-Item -ItemType Directory -Path $publicRoot -Force | Out-Null

          foreach ($number in $numbers) {
            $setName = "article-$('{0:D2}' -f $number)-carousel"
            $carouselDir = Join-Path $PWD "daily-realestate\output\$date\$setName"
            if (-not (Test-Path $carouselDir)) {
              throw "Carousel directory not found: $carouselDir"
            }
            $placeholderBase = "https://example.com/replace-after-pages-deploy/realestate/$date/$setName"
            powershell -NoProfile -ExecutionPolicy Bypass -File .\daily-realestate\publish-instagram-carousel.ps1 -CarouselDir $carouselDir -ImageBaseUrl $placeholderBase -PrepareJpeg -DryRun
            $targetDir = Join-Path $publicRoot $setName
            New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
            Get-ChildItem -LiteralPath (Join-Path $carouselDir "_publish") -Filter "*.jpg" | Copy-Item -Destination $targetDir -Force
            Copy-Item -LiteralPath (Join-Path $carouselDir "caption.txt") -Destination $targetDir -Force
            Copy-Item -LiteralPath (Join-Path $carouselDir "REVIEW.md") -Destination $targetDir -Force
          }

          @"
          <!doctype html>
          <html lang="ko">
          <head><meta charset="utf-8"><title>Real estate carousel assets</title></head>
          <body><h1>Real estate carousel assets - $date</h1></body>
          </html>
          "@ | Set-Content -LiteralPath (Join-Path $siteRoot "index.html") -Encoding UTF8

      - name: Configure GitHub Pages
        if: ${{ steps.request.outputs.enabled == 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: ${{ steps.request.outputs.enabled == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        if: ${{ steps.request.outputs.enabled == 'true' }}
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Write final public URL manifests
        if: ${{ steps.request.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          $date = "${{ steps.request.outputs.date }}"
          $pageUrl = "${{ steps.deploy.outputs.page_url }}".TrimEnd('/')
          $numbers = "${{ steps.request.outputs.numbers }}" -split '[,\s]+' | Where-Object { $_ -match '^\d+$' } | ForEach-Object { [int]$_ } | Select-Object -Unique
          foreach ($number in $numbers) {
            $setName = "article-$('{0:D2}' -f $number)-carousel"
            $carouselDir = ".\daily-realestate\output\$date\$setName"
            $imageBaseUrl = "$pageUrl/realestate/$date/$setName"
            powershell -NoProfile -ExecutionPolicy Bypass -File .\daily-realestate\publish-instagram-carousel.ps1 -CarouselDir $carouselDir -ImageBaseUrl $imageBaseUrl -DryRun
          }

      - name: Verify public JPEG URLs
        if: ${{ steps.request.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\daily-realestate\verify-public-image-urls.ps1 -Date "${{ steps.request.outputs.date }}" -Numbers "${{ steps.request.outputs.numbers }}" -Attempts 12 -DelaySeconds 5

      - name: Validate carousel output
        if: ${{ steps.request.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\daily-realestate\validate-carousel-output.ps1 -Date "${{ steps.request.outputs.date }}" -Numbers "${{ steps.request.outputs.numbers }}" -RequireJpeg

      - name: Require publish confirmation
        if: ${{ steps.request.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          if ("${{ steps.request.outputs.publish_to_instagram }}" -ne "True" -and "${{ steps.request.outputs.publish_to_instagram }}" -ne "true") {
            throw "publish_to_instagram must be true in publish-request.json"
          }
          if ("${{ steps.request.outputs.review_confirmed }}" -ne "True" -and "${{ steps.request.outputs.review_confirmed }}" -ne "true") {
            throw "review_confirmed must be true in publish-request.json"
          }
          if ("${{ steps.request.outputs.image_usage_confirmed }}" -ne "True" -and "${{ steps.request.outputs.image_usage_confirmed }}" -ne "true") {
            throw "image_usage_confirmed must be true in publish-request.json"
          }

      - name: Publish through Meta API
        if: ${{ steps.request.outputs.enabled == 'true' }}
        shell: pwsh
        env:
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          META_GRAPH_HOST: ${{ vars.META_GRAPH_HOST }}
          META_IS_AI_GENERATED: ${{ vars.META_IS_AI_GENERATED }}
          META_ALT_TEXT_PREFIX: ${{ vars.META_ALT_TEXT_PREFIX }}
        run: |
          if (-not $env:META_IG_USER_ID) { throw "Missing secret META_IG_USER_ID" }
          if (-not $env:META_IG_ACCESS_TOKEN) { throw "Missing secret META_IG_ACCESS_TOKEN" }

          $date = "${{ steps.request.outputs.date }}"
          $pageUrl = "${{ steps.deploy.outputs.page_url }}".TrimEnd('/')
          $numbers = "${{ steps.request.outputs.numbers }}" -split '[,\s]+' | Where-Object { $_ -match '^\d+$' } | ForEach-Object { [int]$_ } | Select-Object -Unique
          foreach ($number in $numbers) {
            $setName = "article-$('{0:D2}' -f $number)-carousel"
            $carouselDir = ".\daily-realestate\output\$date\$setName"
            $imageBaseUrl = "$pageUrl/realestate/$date/$setName"
            powershell -NoProfile -ExecutionPolicy Bypass -File .\daily-realestate\publish-instagram-carousel.ps1 -CarouselDir $carouselDir -ImageBaseUrl $imageBaseUrl
          }

      - name: Upload publish logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-requested-${{ steps.request.outputs.date }}
          path: |
            daily-realestate/output/${{ steps.request.outputs.date }}/article-*-carousel/article-detail.json
            daily-realestate/output/${{ steps.request.outputs.date }}/article-*-carousel/REVIEW.md
            daily-realestate/output/${{ steps.request.outputs.date }}/article-*-carousel/chrome-render.log
            daily-realestate/output/${{ steps.request.outputs.date }}/article-*-carousel/publish-manifest.json
            daily-realestate/output/${{ steps.request.outputs.date }}/validation-report.json
            daily-realestate/output/${{ steps.request.outputs.date }}/public-image-url-report.json
            daily-realestate/output/${{ steps.request.outputs.date }}/article-*-carousel/content-publishing-limit.json
            daily-realestate/output/${{ steps.request.outputs.date }}/article-*-carousel/publish-container-status.json
            daily-realestate/output/${{ steps.request.outputs.date }}/article-*-carousel/publish-result.json
          if-no-files-found: warn
          retention-days: 14
